<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Congee Queen | Home</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #956f4b;
      color: #f6f0e8;
      font-family: Arial, sans-serif;
    }

    .tab-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      background: #30251e;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 6px;
      background: #604633;
      color: white;
      font: inherit;
      text-decoration: none;
    }

    .tab-btn:hover, .tab-btn.active { background: #967044; }

    .video-section {
      width: 100%;
      margin: 0;
      padding: 24px;
      text-align: center;
      background: #422e20;
      border-bottom: 1px solid #c1a77e;
    }

    .video-section h1 { margin-top: 0; }

    .video-player {
      display: block;
      width: 100%;
      height: min(72vh, 760px);
      min-height: 400px;
      margin: 18px 0;
      background: #1b1511;
      object-fit: cover;
    }

    .video-picker {
      max-width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: #604633;
      color: #f6f0e8;
      font: inherit;
    }

    .scroll-link { color: #f2d19b; }

    .review-section {
      max-width: 850px;
      margin: 28px auto;
      padding: 24px;
      border: 1px solid #c1a77e;
      border-radius: 10px;
      background: #604633;
    }

    .review-section h2 { margin-top: 0; }

    .review-form {
      display: grid;
      gap: 12px;
    }

    .review-form label { font-weight: bold; }

    .review-form input, .review-form select, .review-form textarea,
    .review-form button {
      width: 100%;
      padding: 10px;
      border: 1px solid #c1a77e;
      border-radius: 6px;
      font: inherit;
    }

    .review-form textarea { min-height: 90px; resize: vertical; }

    .review-form button {
      background: #967044;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .review-card {
      margin-top: 16px;
      padding: 14px;
      border-radius: 6px;
      background: #422e20;
    }

    .review-stars { color: #ffd166; }

    .recommendations-title {
      max-width: 1200px;
      margin: 28px auto 0;
      padding: 0 30px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 30px 30px;
      background: #422e20;
    }

    .feature-card {
      overflow: hidden;
      border: 1px solid #c1a77e;
      border-radius: 8px;
      background: #a58a6d;
      box-shadow: 0 3px 9px #21170f70;
    }

    .feature-card h2 {
      min-height: 60px;
      margin: 0;
      padding: 17px 12px;
      background: #4b3828;
      color: #f2eee9;
      font-size: clamp(17px, 2vw, 23px);
    }

    .feature-card img {
      display: block;
      width: 100%;
      height: 265px;
      object-fit: cover;
    }

    @media (max-width: 700px) {
      .video-section { margin: 0; padding: 18px; }
      .video-player { height: 60vh; min-height: 280px; }
      .recommendations-title { padding: 0 18px; }
      .features { grid-template-columns: 1fr; max-width: 460px; padding: 18px; }
      .feature-card img { height: 230px; }
    }
  </style>
</head>
<body>
  <nav class="tab-buttons" aria-label="Page navigation">
    <a class="tab-btn active" href="index.html" aria-current="page">Home Page</a>
    <a class="tab-btn" href="page2.html">Menu</a>
    <a class="tab-btn" href="page3.html">About Me</a>
  </nav>

  <main>
    <section class="video-section" aria-labelledby="home-video-title">
      <h1 id="home-video-title">Congee Queen Review Video</h1>
      <iframe
        class="video-player"
        src="https://www.youtube.com/embed/I8ppgtUAYbQ?autoplay=1&amp;mute=1&amp;playsinline=1"
        title="Congee Queen video"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
      <p><a class="scroll-link" href="#top-picks">Scroll down to see our top 3 favourites and recommendations</a></p>
    </section>

    <section class="review-section" aria-labelledby="reviews-title">
      <h2 id="reviews-title">Leave a Review</h2>
      <form class="review-form" id="review-form">
        <label for="reviewer-name">Your name</label>
        <input id="reviewer-name" name="name" type="text" required maxlength="60" placeholder="Enter your name">

        <label for="review-rating">Your star rating</label>
        <select id="review-rating" name="rating" required>
          <option value="5">5 stars</option>
          <option value="4">4 stars</option>
          <option value="3">3 stars</option>
          <option value="2">2 stars</option>
          <option value="1">1 star</option>
        </select>

        <label for="review-text">Your review</label>
        <textarea id="review-text" name="review" required maxlength="500" placeholder="Share what you think"></textarea>

        <button type="submit">Submit review</button>
      </form>
      <div id="reviews-list" aria-live="polite"></div>
    </section>

    <h1 class="recommendations-title" id="top-picks">Top 3 Favourites &amp; Recommendations</h1>
    <section class="features" aria-label="Featured dishes">
      <article class="feature-card">
        <h2>Hot Picks</h2>
        <a href="page2.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTb8Ypt-Bx0jVR0OIjs3uRamowlKKsy_FDfeevDT96MvQ&amp;s=10" alt="Wonton noodles from Congee Queen"></a>
      </article>
      <article class="feature-card">
        <h2>Fish Soup Noodle</h2>
        <a href="page2.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrSiJmQGO1XLz3Hxqgfju11X3KfYCjrqa_sZ511edQEg&amp;s=10" alt="A warm Congee Queen dish"></a>
      </article>
      <article class="feature-card">
        <h2>Party Tray</h2>
        <a href="page2.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbEW5r5SqK-88ll7k32_9l0BpxaChHr1QDLV9U_CMWIA&amp;s=10" alt="Soya sauce chicken for sharing"></a>
      </article>
    </section>
  </main>

  <script>
    const reviewForm = document.getElementById('review-form');
    const reviewsList = document.getElementById('reviews-list');

    reviewForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const name = document.getElementById('reviewer-name').value.trim();
      const rating = Number(document.getElementById('review-rating').value);
      const review = document.getElementById('review-text').value.trim();
      const card = document.createElement('article');
      card.className = 'review-card';

      const heading = document.createElement('h3');
      heading.textContent = name;
      const score = document.createElement('p');
      score.className = 'review-stars';
      score.setAttribute('aria-label', rating + ' out of 5 stars');
      score.textContent = '★'.repeat(rating) + '☆'.repeat(5 - rating) + ' (' + rating + '/5)';
      const comment = document.createElement('p');
      comment.textContent = review;

      card.append(heading, score, comment);
      reviewsList.prepend(card);
      reviewForm.reset();
    });
  </script>
</body>
</html>
