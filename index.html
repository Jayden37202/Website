<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Congee Queen | Home</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #956f4b;
      color: #f6f0e8;
      font-family: Arial, sans-serif;
    }

    .tab-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      background: #30251e;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 6px;
      background: #604633;
      color: white;
      font: inherit;
      text-decoration: none;
    }

    .tab-btn:hover, .tab-btn.active { background: #967044; }

    .features {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 30px 30px;
      background: #422e20;
    }

    .feature-card {
      overflow: hidden;
      border: 1px solid #c1a77e;
      border-radius: 8px;
      background: #a58a6d;
      box-shadow: 0 3px 9px #21170f70;
    }

    .feature-card h2 {
      min-height: 60px;
      margin: 0;
      padding: 17px 12px;
      background: #4b3828;
      color: #f2eee9;
      font-size: clamp(17px, 2vw, 23px);
    }

    .feature-card img {
      display: block;
      width: 100%;
      height: 265px;
      object-fit: cover;
    }

    @media (max-width: 700px) {
      .features { grid-template-columns: 1fr; max-width: 460px; padding: 18px; }
      .feature-card img { height: 230px; }
    }
  </style>
</head>
<body>
  <nav class="tab-buttons" aria-label="Page navigation">
    <a class="tab-btn active" href="index.html" aria-current="page">Home Page</a>
    <a class="tab-btn" href="page2.html">Menu</a>
    <a class="tab-btn" href="page3.html">About Me</a>
  </nav>

  <main>
    <section class="features" aria-label="Featured dishes">
      <article class="feature-card">
        <h2>Hot Picks</h2>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTb8Ypt-Bx0jVR0OIjs3uRamowlKKsy_FDfeevDT96MvQ&amp;s=10" alt="Wonton noodles from Congee Queen">
      </article>
      <article class="feature-card">
        <h2>Fish Soup Noodle</h2>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrSiJmQGO1XLz3Hxqgfju11X3KfYCjrqa_sZ511edQEg&amp;s=10" alt="A warm Congee Queen dish">
      </article>
      <article class="feature-card">
        <h2>Party Tray</h2>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbEW5r5SqK-88ll7k32_9l0BpxaChHr1QDLV9U_CMWIA&amp;s=10" alt="Soya sauce chicken for sharing">
      </article>
    </section>
  </main>
</body>
</html>
